name: Format code

on:
  push:
    branches:
      - format/clean-code

permissions:
  contents: write

jobs:
  prettier:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Format source files
        run: npx --yes prettier@3.5.3 --write "src/**/*.{js,jsx,css}" "*.{js,jsx,css,json}"

      - name: Commit formatted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --cached --quiet || git commit -m "style: format project source files"
          git push
