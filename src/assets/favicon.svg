<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="border" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00d9ff"/>
      <stop offset="100%" stop-color="#1769ff"/>
    </linearGradient>
    <linearGradient id="pc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2c8cff"/>
      <stop offset="100%" stop-color="#0758d9"/>
    </linearGradient>
  </defs>

  <!-- Fondo -->
  <rect width="512" height="512" rx="90" fill="#050b18"/>

  <!-- Borde -->
  <circle
    cx="256"
    cy="256"
    r="222"
    fill="none"
    stroke="url(#border)"
    stroke-width="20"
  />

  <!-- Monitor -->
  <rect
    x="105"
    y="105"
    width="302"
    height="205"
    rx="24"
    fill="#ffffff"
  />

  <rect
    x="125"
    y="125"
    width="262"
    height="165"
    rx="12"
    fill="#081326"
  />

  <!-- PC / símbolo -->
  <path
    d="M175 155h45v105h-45z"
    fill="url(#pc)"
  />

  <path
    d="M220 155h55v35h-55z"
    fill="#ffffff"
  />

  <path
    d="M220 190h35v70h-35z"
    fill="#ffffff"
  />

  <path
    d="M255 190h20v35h-20z"
    fill="url(#pc)"
  />

  <!-- Soporte -->
  <path
    d="M225 310h62v25h-62z"
    fill="#ffffff"
  />

  <path
    d="M185 335h142v18H185z"
    rx="9"
    fill="url(#border)"
  />

  <!-- Texto -->
  <text
    x="256"
    y="405"
    text-anchor="middle"
    font-family="Arial, Helvetica, sans-serif"
    font-size="55"
    font-weight="800"
    letter-spacing="3"
  >
    <tspan fill="#2584ff">PC</tspan>
    <tspan fill="#ffffff"> STORE</tspan>
  </text>

  <!-- Detalle inferior -->
  <circle cx="256" cy="455" r="5" fill="#00d9ff"/>
